plugins
{
	id 'fabric-loom' version '0.10-SNAPSHOT'
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_16
targetCompatibility = JavaVersion.VERSION_16

archivesBaseName = "${project.archives_base_name}-FABRIC-${project.minecraft_version}"
version = project.mod_version
group = project.maven_group

repositories
{
	maven { url = 'https://maven.parchmentmc.org/' }
}

dependencies
{
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered()
	{
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.mappings_version}@zip")
	}

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources
{
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 16 }

java { withSourcesJar() }